<!DOCTYPE html>
<html lang="en" id="app-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K12 Launch Pad - Home</title>
    <link rel="icon" type="image/png" href="https://imgur.com/UNZK8ik.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 'k12-blue': '#0033cc', 'k12-bg': '#f0f7ff' },
                    animation: { 'pulse-fast': 'pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }

        const STORAGE_KEY = 'tigr_hidden_widgets';
        const TODO_KEY = 'tigr_todo_list';
        const MUTE_KEY = 'tigr_muted';
        const THEME_KEY = 'tigr_dark_mode';
        
        let hiddenWidgets = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        let todos = JSON.parse(localStorage.getItem(TODO_KEY) || "[]");
        let isMuted = JSON.parse(localStorage.getItem(MUTE_KEY) || "false");
        let isDark = JSON.parse(localStorage.getItem(THEME_KEY) || "false");
        let isEditMode = false;
        let lastFetchedSessions = []; // Global store for the timer

        const bellSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

        async function updateWeather() {
            try {
                const geoRes = await fetch('https://ipapi.co/json/');
                const geoData = await geoRes.json();
                const { city, latitude, longitude } = geoData;
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&temperature_unit=fahrenheit`);
                const weatherData = await weatherRes.json();
                const temp = Math.round(weatherData.current_weather.temperature);
                const code = weatherData.current_weather.weathercode;
                let emoji = "☁️";
                if (code <= 3) emoji = "☀️";
                else if (code >= 51 && code <= 67) emoji = "🌧️";
                else if (code >= 71 && code <= 77) emoji = "❄️";
                else if (code >= 95) emoji = "⛈️";
                document.getElementById('weather-display').innerHTML = `
                    <div class="flex items-center gap-2 mt-4 bg-white/20 px-5 py-2 rounded-full border border-white/10 backdrop-blur-sm">
                        <span class="text-2xl">${emoji}</span>
                        <span class="text-sm font-black uppercase tracking-widest">${city}: ${temp}°F</span>
                    </div>`;
            } catch (e) {
                document.getElementById('weather-display').innerHTML = `<span class="text-[10px] opacity-50 uppercase font-bold">Weather Unavailable</span>`;
            }
        }

        async function fetchCanvasData() {
            try {
                const response = await fetch('/api/assignments'); 
                if (response.status === 401) {
                    document.getElementById('auth-section').classList.remove('hidden');
                    return;
                }
                const data = await response.json();
                document.getElementById('auth-section').classList.add('hidden');
                
                if (data.main_school) {
                    document.getElementById('school-initial-text').innerText = data.main_school;
                    document.getElementById('school-pill').classList.remove('hidden');
                }

                if (data.user) {
                    const hour = new Date().getHours();
                    let greeting = hour < 12 ? "Good Morning" : hour < 18 ? "Good Afternoon" : "Good Evening";
                    document.getElementById('user-greeting').innerText = `${greeting}, ${data.user.replace(/Gradebook/gi, '').trim()}!`;
                }

                document.getElementById('course-list').innerHTML = data.courses.map(course => {
                    const enrollment = course.enrollments?.[0] || {};
                    const score = Math.round(enrollment.computed_current_score) || 0;
                    const gradeColor = score >= 90 ? 'text-green-500 bg-green-50' : score >= 80 ? 'text-blue-500 bg-blue-50' : 'text-slate-500 bg-slate-100';
                    return `
                        <div id="course-${course.id}" class="min-w-[280px] bg-white dark:bg-slate-900 p-6 rounded-[2.5rem] shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col justify-between relative group transition-all">
                            <button onclick="removeWidget('course-${course.id}')" class="remove-handle hidden absolute -top-2 left-1/2 -translate-x-1/2 bg-red-400 text-white w-6 h-1.5 rounded-full z-10"></button>
                            <div>
                                <div class="flex justify-between items-start mb-4">
                                    <div class="flex flex-col">
                                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Grade</span>
                                        <span class="text-2xl font-black text-slate-800 dark:text-white">${enrollment.computed_current_grade || 'N/A'}</span>
                                    </div>
                                    <button class="text-[10px] font-bold ${gradeColor} px-3 py-1 rounded-full">${score}%</button>
                                </div>
                                <h3 class="font-black text-slate-800 dark:text-white text-sm mb-4 h-10 overflow-hidden leading-tight">${course.name}</h3>
                                <div class="bg-sky-100 dark:bg-sky-900/30 rounded-3xl h-24 flex items-center justify-center mb-4 text-4xl">${score > 89 ? '🔥' : '📚'}</div>
                            </div>
                            <a href="https://stridek12academy.com/courses/${course.id}" target="_blank" class="w-full py-2.5 border-2 border-blue-600 text-blue-600 rounded-full text-[11px] font-black text-center hover:bg-blue-600 hover:text-white transition-all uppercase tracking-widest">Go to Class</a>
                        </div>`;
                }).join('');

                const plannerItems = data.planner || [];
                document.getElementById('lessons-list').innerHTML = plannerItems.filter(p => p.plannable_type !== 'calendar_event').slice(0, 3).map(item => `
                    <a href="${item.html_url || '#'}" target="_blank" class="block p-3 bg-sky-50 dark:bg-slate-800 rounded-2xl flex justify-between items-center hover:bg-sky-100 transition-colors">
                        <p class="font-bold text-slate-800 dark:text-slate-200 text-xs truncate">${item.plannable?.title || item.title}</p>
                        <span class="text-blue-600 font-bold ml-2">❯</span>
                    </a>`).join('');

                let allLiveSessions = [];
                const today = new Date().toDateString();

                for (const course of data.courses) {
                    try {
                        const confRes = await fetch(`/api/v1/courses/${course.id}/conferences`);
                        const conferences = await confRes.json();
                        const activeBBB = conferences.filter(c => c.status === 'in_progress' || c.join_url);
                        
                        activeBBB.forEach(conf => {
                            allLiveSessions.push({
                                title: conf.title,
                                url: conf.join_url || `/courses/${course.id}/conferences`,
                                type: 'BigBlueButton',
                                courseName: course.name,
                                date: new Date()
                            });
                        });
                    } catch (err) { console.warn("BBB Check failed", course.id); }
                }

                plannerItems.forEach(item => {
                    const itemDate = new Date(item.plannable_date || item.todo_date).toDateString();
                    const title = (item.plannable?.title || item.title || "").toLowerCase();
                    const isLiveTitle = title.includes('live') || title.includes('session') || title.includes('homeroom') || title.includes('zoom');
                    
                    if (itemDate === today && (item.plannable_type === 'calendar_event' || isLiveTitle)) {
                        if (!allLiveSessions.some(s => s.title === (item.plannable?.title || item.title))) {
                            allLiveSessions.push({
                                title: item.plannable?.title || item.title,
                                url: item.html_url || item.plannable?.html_url || `/courses/${item.course_id}/conferences`,
                                type: 'Live Session',
                                courseName: item.context_name,
                                date: new Date(item.plannable_date || item.todo_date)
                            });
                        }
                    }
                });

                lastFetchedSessions = allLiveSessions; // Update cache
                renderLiveSessions(allLiveSessions);
                applyWidgetVisibility();

            } catch (e) { console.error("Error loading dashboard:", e); }
        }

        function renderLiveSessions(sessions) {
            const calContent = document.getElementById('calendar-content');
            if (!sessions || sessions.length === 0) {
                calContent.innerHTML = `<p class="text-[10px] font-bold text-slate-400 text-center py-6 uppercase tracking-widest">No live sessions detected</p>`;
                return;
            }

            sessions.sort((a, b) => a.date - b.date);

            calContent.innerHTML = sessions.map(item => {
                const now = new Date();
                const diffMs = item.date - now;
                const diffMins = Math.floor(diffMs / 60000);
                
                let statusLabel = "LIVE";
                let statusColor = "bg-red-500";
                let pulseClass = "animate-pulse";

                if (diffMins > 0 && diffMins <= 60) {
                    statusLabel = `In ${diffMins}m`;
                    statusColor = "bg-amber-500";
                    pulseClass = "";
                }

                const timeStr = item.date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                return `
                    <div class="flex items-center gap-4 mb-3 last:mb-0 bg-blue-50 dark:bg-slate-800/50 p-3 rounded-2xl border border-blue-100 dark:border-slate-700 transition-all">
                        <div class="${statusColor} ${pulseClass} text-white rounded-xl p-2 text-center min-w-[55px] shadow-sm">
                            <div class="text-[8px] font-black leading-none uppercase tracking-tighter">${statusLabel}</div>
                            <div class="text-[10px] font-black leading-none mt-0.5">${timeStr.split(' ')[0]}</div>
                        </div>
                        <div class="overflow-hidden flex-grow">
                            <p class="text-xs font-black text-slate-800 dark:text-white truncate uppercase tracking-tight">${item.title}</p>
                            <p class="text-[10px] font-bold text-blue-500 uppercase tracking-tighter opacity-80">${item.courseName || 'Class'}</p>
                        </div>
                        <a href="${item.url}" target="_blank" onclick="triggerConfetti()"
                           class="bg-blue-600 text-white text-[10px] font-black px-4 py-2 rounded-full hover:bg-blue-700 transition-all shadow-sm active:scale-95">
                            JOIN
                        </a>
                    </div>`;
            }).join('');
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#0033cc', '#ffffff', '#ff0000']
            });
        }

        function toggleTheme() { isDark = !isDark; localStorage.setItem(THEME_KEY, JSON.stringify(isDark)); applyTheme(); }
        function applyTheme() { document.documentElement.classList.toggle('dark', isDark); document.getElementById('theme-btn').innerHTML = isDark ? '☀️ Light' : '🌙 Dark'; }
        function testBell() { bellSound.play().catch(() => alert("Interaction required for audio!")); }
        function toggleMute() { isMuted = !isMuted; localStorage.setItem(MUTE_KEY, JSON.stringify(isMuted)); updateMuteUI(); }
        function updateMuteUI() { 
            const btn = document.getElementById('mute-btn');
            btn.innerHTML = isMuted ? '🔇 Muted' : '🔔 Alerts';
            btn.classList.toggle('opacity-50', isMuted);
        }
        function renderTodos() {
            document.getElementById('todo-list').innerHTML = todos.map((t, i) => `
                <div class="flex items-center gap-2">
                    <input type="checkbox" onchange="removeTodo(${i})" class="w-4 h-4 accent-blue-600 cursor-pointer">
                    <span class="text-xs font-bold text-slate-600 dark:text-slate-300">${t}</span>
                </div>`).join('');
        }
        function addTodo() {
            const input = document.getElementById('todo-input');
            if (input.value.trim()) { todos.push(input.value.trim()); localStorage.setItem(TODO_KEY, JSON.stringify(todos)); input.value = ''; renderTodos(); }
        }
        function removeTodo(index) { setTimeout(() => { todos.splice(index, 1); localStorage.setItem(TODO_KEY, JSON.stringify(todos)); renderTodos(); }, 300); }
        function toggleEdit() { isEditMode = !isEditMode; document.getElementById('edit-btn').innerText = isEditMode ? 'Done' : '✎ Edit'; document.querySelectorAll('.remove-handle').forEach(h => h.classList.toggle('hidden', !isEditMode)); }
        function removeWidget(id) { document.getElementById(id).style.display = 'none'; hiddenWidgets.push(id); localStorage.setItem(STORAGE_KEY, JSON.stringify(hiddenWidgets)); }
        function applyWidgetVisibility() { hiddenWidgets.forEach(id => { if(document.getElementById(id)) document.getElementById(id).style.display = 'none'; }); }
        function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
        function updateProgress() {
            const total = new Date(2026, 5, 15) - new Date(2025, 8, 1);
            const current = new Date() - new Date(2025, 8, 1);
            const percent = Math.min(100, Math.max(0, (current / total) * 100));
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = Math.round(percent) + '% of School Year Complete';
        }

        window.onload = () => {
            applyTheme(); updateClock(); updateProgress(); renderTodos(); updateMuteUI(); updateWeather();
            setInterval(updateClock, 1000); 
            fetchCanvasData(); 
            setInterval(fetchCanvasData, 60000);
            // Minute-by-minute countdown refresh
            setInterval(() => {
                if (lastFetchedSessions.length > 0) renderLiveSessions(lastFetchedSessions);
            }, 60000);
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        body { font-family: 'Nunito', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#f0f7ff] dark:bg-slate-950 min-h-screen p-4 md:p-8 flex flex-col transition-colors duration-500">
    <header class="max-w-7xl mx-auto w-full flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
            <div class="text-blue-600 font-black text-4xl tracking-tighter dark:text-white">k12<span class="text-xs align-top font-bold ml-0.5">®</span></div>
            <div id="school-pill" class="hidden border-2 border-blue-500 rounded-full px-4 py-0.5">
                <span id="school-initial-text" class="text-blue-600 dark:text-blue-400 font-black text-xs tracking-widest uppercase"></span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="testBell()" class="text-[10px] font-black text-slate-400 hover:text-blue-600 uppercase">Test 🔔</button>
            <button id="mute-btn" onclick="toggleMute()" class="text-[10px] font-black uppercase text-blue-600"></button>
            <button id="theme-btn" onclick="toggleTheme()" class="text-[10px] font-black uppercase text-slate-500 hover:text-blue-600">🌙 Dark</button>
            <button onclick="localStorage.clear(); location.reload();" class="text-[10px] font-black text-slate-400 uppercase hover:text-red-500">Reset</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full flex-grow">
        <div class="flex justify-between items-center mb-8">
            <h2 id="user-greeting" class="text-4xl font-black text-slate-900 dark:text-white tracking-tight">Welcome!</h2>
            <button id="edit-btn" onclick="toggleEdit()" class="bg-white dark:bg-slate-900 px-6 py-2 rounded-full border border-slate-200 dark:border-slate-800 shadow-sm text-sm font-bold text-blue-600 hover:scale-105 transition-all">✎ Edit</button>
        </div>

        <div id="w-progress" class="bg-white dark:bg-slate-900 p-6 rounded-[2rem] mb-8 border border-slate-100 dark:border-slate-800 relative group">
            <button onclick="removeWidget('w-progress')" class="remove-handle hidden absolute -top-2 left-1/2 -translate-x-1/2 bg-red-400 w-6 h-1.5 rounded-full z-20"></button>
            <div class="flex justify-between items-center mb-2">
                <span id="progress-text" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Loading...</span>
            </div>
            <div class="w-full bg-slate-100 dark:bg-slate-800 h-3 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-blue-600 h-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
            <div id="w-focus" class="bg-white dark:bg-slate-900 rounded-[2.5rem] p-8 border border-slate-50 dark:border-slate-800 relative group">
                <button onclick="removeWidget('w-focus')" class="remove-handle hidden absolute -top-2 left-1/2 -translate-x-1/2 bg-red-400 w-6 h-1.5 rounded-full z-20"></button>
                <h3 class="text-xl font-black mb-6 dark:text-white">To-Do Next</h3>
                <div id="lessons-list" class="space-y-4"></div>
            </div>

            <div id="w-clock" class="bg-blue-600 rounded-[2.5rem] p-8 text-white flex flex-col items-center justify-center shadow-lg relative group overflow-hidden transition-all duration-300">
                <button onclick="removeWidget('w-clock')" class="remove-handle hidden absolute -top-2 left-1/2 -translate-x-1/2 bg-white/40 w-6 h-1.5 rounded-full z-20"></button>
                <div id="clock" class="text-7xl font-black tracking-tighter">00:00</div>
                <div id="weather-display" class="flex flex-col items-center">
                    <span class="animate-pulse text-[10px] font-bold uppercase tracking-widest mt-4">Loading Weather...</span>
                </div>
            </div>

            <div id="w-todo" class="bg-white dark:bg-slate-900 rounded-[2.5rem] p-8 border border-slate-50 dark:border-slate-800 relative group">
                <button onclick="removeWidget('w-todo')" class="remove-handle hidden absolute -top-2 left-1/2 -translate-x-1/2 bg-red-400 w-6 h-1.5 rounded-full z-20"></button>
                <h3 class="text-xl font-black mb-4 dark:text-white text-center">My Tasks</h3>
                <div id="todo-list" class="space-y-3 mb-4 max-h-[120px] overflow-y-auto no-scrollbar"></div>
                <div class="flex gap-2">
                    <input type="text" id="todo-input" onkeypress="if(event.key==='Enter') addTodo()" placeholder="Type a task..." class="w-full bg-slate-50 dark:bg-slate-800 dark:text-white rounded-xl px-4 py-2 text-xs font-bold outline-none border border-transparent focus:border-blue-500">
                    <button onclick="addTodo()" class="bg-blue-600 text-white px-4 rounded-xl font-black text-lg">+</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
            <div class="space-y-6">
                <a href="https://www.biguniverse.com/login/" target="_blank" id="w-library" class="bg-white dark:bg-slate-900 p-8 rounded-[2.5rem] border border-slate-100 dark:border-slate-800 flex flex-col items-center justify-center relative group hover:shadow-lg transition-all h-[130px]">
                    <button onclick="event.preventDefault(); removeWidget('w-library')" class="remove-handle hidden absolute -top-2 left-1/2 -translate-x-1/2 bg-red-400 w-6 h-1.5 rounded-full z-20"></button>
                    <div class="text-blue-600 font-black text-xl mb-1">Library</div>
                    <div class="w-10 h-1 bg-pink-500 rounded-full"></div>
                </a>
                <a href="https://www.stridelogin.com/login/" target="_blank" id="w-arcade" class="bg-purple-600 p-8 rounded-[2.5rem] flex flex-col items-center justify-center text-white relative group hover:scale-[1.02] transition-all h-[130px]">
                    <button onclick="event.preventDefault(); removeWidget('w-arcade')" class="remove-handle hidden absolute -top-2 left-1/2 -translate-x-1/2 bg-white/20 w-6 h-1.5 rounded-full z-20"></button>
                    <span class="text-2xl mb-1">🎮</span>
                    <span class="font-black text-[10px] uppercase tracking-widest text-center">Skills Arcade</span>
                </a>
            </div>

            <div id="w-calendar" class="lg:col-span-2 bg-white dark:bg-slate-900 rounded-[2.5rem] p-8 border border-slate-100 dark:border-slate-800 relative group">
                <button onclick="removeWidget('w-calendar')" class="remove-handle hidden absolute -top-2 left-1/2 -translate-x-1/2 bg-red-400 w-6 h-1.5 rounded-full z-20"></button>
                <div class="flex justify-between items-center mb-6">
                    <h4 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em]">Live Schedule</h4>
                    <span class="text-[10px] font-bold text-blue-600 bg-blue-50 dark:bg-blue-900/30 px-3 py-1 rounded-full uppercase">Today</span>
                </div>
                <div id="calendar-content" class="grid grid-cols-1 gap-3"></div>
            </div>

            <div class="space-y-6">
                <a href="https://account.tutoring.k12.com/login/" target="_blank" id="w-tutoring" class="bg-teal-800 p-8 rounded-[2.5rem] flex flex-col items-center justify-center text-white relative group hover:scale-[1.02] transition-all h-[130px]">
                    <button onclick="event.preventDefault(); removeWidget('w-tutoring')" class="remove-handle hidden absolute -top-2 left-1/2 -translate-x-1/2 bg-white/20 w-6 h-1.5 rounded-full z-20"></button>
                    <span class="text-2xl mb-1">🎓</span>
                    <span class="font-black text-[10px] uppercase tracking-widest text-center">Tutoring</span>
                </a>
                <a href="https://login.classlink.com/my/k12" target="_blank" id="w-classlink" class="bg-white dark:bg-slate-900 rounded-[2.5rem] p-4 flex flex-col items-center justify-center border border-slate-100 dark:border-slate-800 relative group hover:shadow-lg h-[130px]">
                    <button onclick="event.preventDefault(); removeWidget('w-classlink')" class="remove-handle hidden absolute -top-2 left-1/2 -translate-x-1/2 bg-red-400 w-6 h-1.5 rounded-full z-20"></button>
                    <span class="text-3xl mb-2">🔗</span>
                    <span class="bg-blue-600 text-white px-4 py-2 rounded-full text-[9px] font-black w-full uppercase text-center tracking-widest">Classlink</span>
                </a>
            </div>
        </div>

        <section class="mb-20">
            <h3 class="text-2xl font-black mb-8 dark:text-white">Active Courses</h3>
            <div id="course-list" class="flex gap-6 overflow-x-auto pb-10 no-scrollbar"></div>
        </section>
    </main>

    <footer class="max-w-7xl mx-auto w-full py-12 border-t border-slate-200 dark:border-slate-800 text-center">
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Launchpad V2.0 - Personalized Student Dashboard</p>
    </footer>

    <div id="auth-section" class="hidden fixed inset-0 bg-white dark:bg-slate-950 z-[400] flex flex-col items-center justify-center p-6 text-center">
        <div class="text-blue-600 font-black text-6xl tracking-tighter mb-8 dark:text-white">k12<span class="text-xl align-top font-bold ml-1">®</span></div>
        <p class="mb-8 font-bold text-slate-600 dark:text-slate-400 max-w-sm">Please connect your Canvas account to personalize your dashboard.</p>
        <button onclick="window.location.href='/api/auth/canvas'" class="bg-blue-600 text-white font-black py-5 px-16 rounded-full shadow-2xl uppercase tracking-widest hover:bg-blue-700 transition-all hover:scale-105 active:scale-95">Connect Canvas Account</button>
    </div>
</body>
</html>
