<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stride Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-8">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-blue-400">Launchpad Control Center</h1>

        <section class="bg-gray-800 p-6 rounded-xl shadow-lg mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">School Pill Overrides</h2>
            <div class="flex gap-4 mb-6">
                <input id="userId" type="text" placeholder="Canvas User ID" class="bg-gray-700 p-2 rounded w-full outline-none focus:ring-2 focus:ring-blue-500">
                <input id="initial" type="text" placeholder="Initials (e.g. HCCA)" class="bg-gray-700 p-2 rounded w-full outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="setOverride()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded font-bold transition">Save</button>
            </div>
            <div id="overrideList" class="space-y-2 text-sm text-gray-400">
                </div>
        </section>

        <section class="bg-gray-800 p-6 rounded-xl shadow-lg mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">System Announcement</h2>
            <textarea id="announcementMsg" rows="3" class="w-full bg-gray-700 p-3 rounded mb-4 outline-none focus:ring-2 focus:ring-orange-500" placeholder="Type banner message..."></textarea>
            <button onclick="setAnnouncement()" class="bg-orange-600 hover:bg-orange-500 px-6 py-2 rounded font-bold transition">Update Banner</button>
        </section>

        <section class="bg-gray-800 p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">Live Session Status</h2>
            <div class="flex items-center justify-between p-4 bg-gray-700 rounded-lg">
                <span>Class Connect Mock API</span>
                <span class="text-green-400 font-mono">● ONLINE</span>
            </div>
            <p class="mt-4 text-xs text-gray-500 italic">Note: Sessions are currently auto-generated to show "Live Now" in the dashboard widget.</p>
        </section>
    </div>

    <script>
        async function fetchOverrides() {
            const res = await fetch('/api/admin/overrides');
            const data = await res.json();
            const list = document.getElementById('overrideList');
            list.innerHTML = Object.entries(data).map(([id, init]) => `
                <div class="flex justify-between bg-gray-700/50 p-2 rounded">
                    <span>ID: <strong>${id}</strong> → <span class="text-blue-300">${init}</span></span>
                </div>
            `).join('');
        }

        async function setOverride() {
            const userId = document.getElementById('userId').value;
            const initial = document.getElementById('initial').value;
            await fetch('/api/admin/overrides', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, initial })
            });
            fetchOverrides();
        }

        async function setAnnouncement() {
            const message = document.getElementById('announcementMsg').value;
            await fetch('/api/admin/announcement', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            alert('Announcement Updated!');
        }

        // Load on start
        fetchOverrides();
    </script>
</body>
</html>
